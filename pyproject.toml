[project]
name = "software-team"
version = "0.1.0"
description = "A multi-agent cross-functional software team (PM, UX, Tech Lead, SWE, QA, DevOps) built on LangChain + LangGraph, running on local Ollama models. Takes a spec file and drives a feature through the full SDLC (Plan -> Code -> Deploy -> Operate), generating a runnable project plus CI/CD and DevOps artifacts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]
# LLM providers (pick the one you use; Ollama ships in the base dependencies).
openai = [
    "langchain-openai>=0.2",
]
anthropic = [
    "langchain-anthropic>=0.3",
]
google = [
    "langchain-google-genai>=2.0",
]
llama-cpp = [
    "langchain-community>=0.3",
    "llama-cpp-python>=0.3",
]
# Internet search so every character can fetch the latest info (e.g. current APIs).
search = [
    "ddgs>=9.0",
]
tavily = [
    "tavily-python>=0.5",
]

[project.scripts]
software-team = "software_team.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_team"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff enforces the Google Python Style Guide (naming, imports, docstrings) plus a
# pragmatic set of correctness/modernisation lints. Run `uv run ruff check .`.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (Google import grouping/ordering)
    "N",    # pep8-naming (Google naming conventions)
    "UP",   # pyupgrade (modern syntax)
    "B",    # flake8-bugbear (likely bugs)
    "SIM",  # flake8-simplify
    "BLE",  # flake8-blind-except (flag bare `except Exception`)
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle (Google docstring convention)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["software_team"]

[tool.ruff.lint.flake8-bugbear]
# Typer expresses CLI options as call-valued argument defaults; this is intended.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over full API docstrings.
"tests/**" = ["D"]
# Console glyphs (e.g. "›") are intentional and not confusable in this context.
"src/software_team/ui.py" = ["RUF001"]
